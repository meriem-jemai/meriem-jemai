<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; font-size: 14px; white-space: pre; }
    .bg { fill: #120e26; }
    .bar { fill: #1c1638; }
    .prompt { fill: #f472b6; font-weight: 700; }
    .cmd { fill: #e9e4ff; }
    .star { fill: #8b7fd4; }
    .p1 { fill: #f9a8d4; } .p2 { fill: #f0abfc; } .p3 { fill: #d8b4fe; } .p4 { fill: #c4b5fd; }
    .ring { fill: #7dd3fc; }
    .key { fill: #f472b6; }
    .dot { fill: #4c4380; }
    .val { fill: #e9e4ff; }
    .head { fill: #c4b5fd; font-weight: 700; }
    .line { fill: #3b2f6e; }
    .twinkle { animation: tw 3s ease-in-out infinite; }
    .twinkle2 { animation: tw 3s ease-in-out 1.5s infinite; }
    .blink { animation: bl 1s step-end infinite; }
    @keyframes tw { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes bl { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="880" height="420" rx="14" class="bg" stroke="#3b2f6e" stroke-width="2"/>
  <path d="M10 24 a14 14 0 0 1 14 -14 h852 a14 14 0 0 1 14 14 v20 h-880 z" class="bar"/>
  <circle cx="34" cy="27" r="6" fill="#f472b6"/>
  <circle cx="54" cy="27" r="6" fill="#c4b5fd"/>
  <circle cx="74" cy="27" r="6" fill="#7dd3fc"/>
  <text x="450" y="32" text-anchor="middle" style="fill:#8b7fd4;font-size:13px">meriem@dortmund: ~</text>

  <!-- command -->
  <text x="34" y="74" xml:space="preserve"><tspan class="prompt">meriem@dortmund</tspan><tspan class="cmd">:~$ neofetch --galaxy</tspan></text>

  <!-- planet art -->
  <g xml:space="preserve">
    <text x="30" y="120" class="star twinkle">    .      *          .      +</text>
    <text x="30" y="141" class="p1">         .     _.---._     .</text>
    <text x="30" y="162" class="p1">    *       .-'  .  * '-.      .</text>
    <text x="30" y="183" class="p2">          .'  *    .     '.</text>
    <text x="30" y="204" class="p2">    .    /    .  *    .    \   *</text>
    <text x="30" y="225" class="ring"> ~~~~~~~~|~~~~~~~~~~~~~~~~~|~~~~~~</text>
    <text x="30" y="246" class="p3">         \  *    .    *    /</text>
    <text x="30" y="267" class="p3">    +     '.   .    *    .'    .</text>
    <text x="30" y="288" class="p4">            '-._  .  _.-'</text>
    <text x="30" y="309" class="star twinkle2">    .   *              *</text>
    <text x="30" y="330" class="star twinkle">        .    +        .     .</text>
    <text x="30" y="351" class="star twinkle2">     *        .    *</text>
  </g>

  <!-- info -->
  <g xml:space="preserve">
    <text x="350" y="104"><tspan class="prompt">meriem@dortmund</tspan><tspan class="line"> ─────────────────────────────────</tspan></text>
    <text x="350" y="127"><tspan class="key">Study</tspan><tspan class="dot"> ........ </tspan><tspan class="val">M.Sc. Computer Science @ TU Dortmund</tspan></text>
    <text x="350" y="148"><tspan class="key">Focus</tspan><tspan class="dot"> ........ </tspan><tspan class="val">machine learning, LLMs</tspan></text>
    <text x="350" y="169"><tspan class="key">Work</tspan><tspan class="dot"> ......... </tspan><tspan class="val">Werkstudentin @ Recogizer</tspan></text>
    <text x="350" y="190"><tspan class="key">Thesis</tspan><tspan class="dot"> ....... </tspan><tspan class="val">xLSTM (B.Sc.)</tspan></text>
    <text x="350" y="211"><tspan class="key">Speaks</tspan><tspan class="dot"> ....... </tspan><tspan class="val">German, English, French</tspan></text>

    <text x="350" y="240"><tspan class="line">─ </tspan><tspan class="head">Stack</tspan><tspan class="line"> ──────────────────────────────────────</tspan></text>
    <text x="350" y="263"><tspan class="key">Code</tspan><tspan class="dot"> ......... </tspan><tspan class="val">Python, PyTorch, pandas</tspan></text>
    <text x="350" y="284"><tspan class="key">LLM</tspan><tspan class="dot"> .......... </tspan><tspan class="val">LangChain, LangGraph, RAG, MCP</tspan></text>
    <text x="350" y="305"><tspan class="key">Tools</tspan><tspan class="dot"> ........ </tspan><tspan class="val">Git, GitLab</tspan></text>

    <text x="350" y="334"><tspan class="line">─ </tspan><tspan class="head">Contact</tspan><tspan class="line"> ────────────────────────────────────</tspan></text>
    <text x="350" y="357"><tspan class="key">Mail</tspan><tspan class="dot"> ......... </tspan><tspan class="val">jemaimeriem100@gmail.com</tspan></text>
    <text x="350" y="378"><tspan class="key">GitHub</tspan><tspan class="dot"> ....... </tspan><tspan class="val">meriem-jemai</tspan></text>
  </g>

  <!-- palette + cursor -->
  <rect x="350" y="394" width="26" height="12" rx="2" fill="#0f0c29"/>
  <rect x="380" y="394" width="26" height="12" rx="2" fill="#302b63"/>
  <rect x="410" y="394" width="26" height="12" rx="2" fill="#8b7fd4"/>
  <rect x="440" y="394" width="26" height="12" rx="2" fill="#c4b5fd"/>
  <rect x="470" y="394" width="26" height="12" rx="2" fill="#f0abfc"/>
  <rect x="500" y="394" width="26" height="12" rx="2" fill="#f472b6"/>
  <rect x="530" y="394" width="26" height="12" rx="2" fill="#7dd3fc"/>
