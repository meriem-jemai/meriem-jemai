<ellipse cx="185" cy="240" rx="100" ry="20" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity=".6" clip-path="url(#front)"/>
</g>
<circle r="7" fill="#f472b6"><animateMotion dur="9s" repeatCount="indefinite" path="M185 135 a105 105 0 1 1 -0.1 0"/></circle>
<path d="M95 115 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#f0abfc" class="twinkle"/>
<path d="M290 360 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#7dd3fc" class="twinkle2"/>

