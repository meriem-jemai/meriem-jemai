<ellipse cx="185" cy="240" rx="100" ry="20" fill="none" stroke="#c4b5fd" stroke-width="1.5" opacity=".4" clip-path="url(#back)"/>
</g>
<circle cx="185" cy="240" r="62" fill="url(#pl)"/>
<path d="M135 225 Q185 212 235 228" stroke="#f9a8d4" stroke-width="5" fill="none" opacity=".25"/>
